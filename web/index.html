  <link rel="stylesheet" href="css/nokia.css">
  <script>
    // Zero-latency mobile gesture & zoom lock (iOS Safari & Chrome)
    (function() {
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(ev) {
        document.addEventListener(ev, function(e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });
      if (window.location.pathname.includes('/web/') || window.location.pathname.endsWith('/web')) {
        window.location.replace('../' + window.location.search);
      }
    })();
  </script>

<body style="background-color: #040506;">
  <div class="page-container">

    <!-- 100% Authentic Photographic Nokia 5310 XpressMusic Device Frame -->

      <!-- Layer 1: 240x320 LCD Screen Layer -->

              <div class="bar b5"></div>
